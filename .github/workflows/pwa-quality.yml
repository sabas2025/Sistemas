name: PWA Quality
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  pwa-static-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install quality dependencies
        # A primeira execucao real da CI (PR #2) mostrou que "npm ci" pode SAIR COM CODIGO 0 e
        # ainda assim deixar node_modules incompleto: apos 7min55s ele morreu com
        # "npm error Exit handler never called!", o passo passou, e a falha so apareceu tres
        # passos adiante como ERR_MODULE_NOT_FOUND em clean-css. Indicador que mente.
        # Aqui a instalacao e CONFERIDA no proprio passo: se faltar pacote, falha aqui, com o
        # nome do que faltou. Uma repeticao cobre a quebra transitoria do npm.
        run: |
          instalar() { npm ci --no-audit --no-fund; }
          conferir() {
            node -e "
              const need = ['clean-css','terser','@playwright/test','@lhci/cli'];
              const faltam = need.filter(p => { try { require.resolve(p + '/package.json'); return false; } catch { return true; } });
              if (faltam.length) { console.error('Instalacao npm incompleta. Faltam: ' + faltam.join(', ')); process.exit(1); }
              console.log('Dependencias conferidas: ' + need.join(', '));
            "
          }
          instalar || echo "npm ci retornou erro; a conferencia abaixo decide."
          if ! conferir; then
            echo "::warning::Instalacao npm saiu incompleta. Limpando e repetindo uma vez."
            rm -rf node_modules
            instalar || echo "npm ci falhou de novo; a conferencia abaixo decide."
            conferir
          fi
      # Era `npm run build:pwa`, que REESCREVIA os .min dentro do runner: os testes abaixo
      # passavam a rodar contra assets recem-construidos enquanto os COMMITADOS podiam estar
      # velhos. Um passo que conserta em silencio o que deveria denunciar e indicador que mente,
      # e foi assim que integration-center.min.css ficou dois meses defasado. Agora confere.
      - name: Assets minificados em dia com a fonte
        run: npm run check:pwa
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated public server
        run: php -S 127.0.0.1:8099 -t public > /tmp/hub-pwa-server.log 2>&1 &
      - name: PWA Playwright tests
        env:
          HUB_BASE_URL: http://127.0.0.1:8099
        run: npm run test:pwa
      - name: Lighthouse quality gates
        run: npm run lighthouse:pwa
      - name: PHP lint telemetry endpoint
        run: php -l public/pwa_telemetry.php
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-quality-reports
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            .lighthouseci
            /tmp/hub-pwa-server.log
